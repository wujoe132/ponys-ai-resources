
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ponys-ai-resources"
version = "0.1.0"
description = "Official Ponys.ai product-link and multilingual-feed helpers"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Ponys.ai", email = "contact@ponys.ai"}]
keywords = ["ai-companion", "ai-character", "feed", "publisher"]
classifiers = ["Programming Language :: Python :: 3"]

[project.urls]
Homepage = "https://ponys.ai/"
Documentation = "https://feeds.ponys.ai/integrations/"
Repository = "https://github.com/wujoe132/ponys-ai-resources"
