<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ponys.ai Character Grid Widget</title>
  <meta name="description" content="Build a visible-attribution character grid using the public Ponys.ai character feed.">
  <link rel="canonical" href="https://feeds.ponys.ai/embed/characters/">
</head>
<body>
<main>
  <h1>Ponys.ai Character Grid Widget</h1>
  <p>Select a locale and publisher identifier. The widget links each visible card to the matching public character profile.</p>
  <label>Locale <select id="locale"><option value="en">English</option>
<option value="ja">日本語</option>
<option value="ko">한국어</option>
<option value="zh-cn">简体中文</option>
<option value="zh-tw">繁體中文</option></select></label>
  <label>Publisher <input id="publisher" value="publisher.example"></label>
  <label>Cards <input id="limit" type="number" min="1" max="20" value="6"></label>
  <button id="build" type="button">Build embed code</button>
  <textarea id="code" rows="6" cols="90" readonly></textarea>
</main>
<script>
  function build() {
    var locale = document.getElementById("locale").value;
    var publisher = document.getElementById("publisher").value || "publisher";
    var limit = document.getElementById("limit").value || "6";
    document.getElementById("code").value =
      '<script src="https://feeds.ponys.ai/embed/character-grid.js" data-locale="' +
      locale + '" data-publisher="' + publisher + '" data-limit="' + limit +
      '" async><' + '/script>';
  }
  document.getElementById("build").addEventListener("click", build);
  build();
</script>
</body>
</html>
